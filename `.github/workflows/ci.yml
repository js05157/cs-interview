name: Validate publisher and Jekyll
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Build public source only
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./blog
          destination: ./_site
      - run: python -m scripts.verify_site --site _site
