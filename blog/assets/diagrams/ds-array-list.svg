<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc"><title id="title">중간 삽입: 배열의 참조 이동과 노드의 연결 변경</title><desc id="desc">여유 용량이 있는 배열은 3을 오른쪽으로 옮겨 2를 넣는다. 연결 리스트는 이미 찾은 두 노드 사이의 prev/next를 바꾼다.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#176859" stroke-width="1.5"/></marker></defs><rect width="1000" height="720" rx="12" fill="#f4f7f6"/><g fill="#19372d" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif"><text x="30" y="43" font-size="25" text-anchor="start" fill="#19372d">중간 삽입: 배열의 참조 이동과 노드의 연결 변경</text><text x="30" y="105" font-size="20" text-anchor="start" fill="#19372d">ArrayList: 여유 용량이 있는 예</text><text x="530" y="105" font-size="20" text-anchor="start" fill="#19372d">LinkedList: 위치를 이미 찾은 예</text><text x="110" y="145" font-size="17" text-anchor="middle" fill="#19372d">인덱스 0</text><text x="240" y="145" font-size="17" text-anchor="middle" fill="#19372d">인덱스 1</text><text x="370" y="145" font-size="17" text-anchor="middle" fill="#19372d">인덱스 2</text><rect x="60" y="170" width="100" height="90" rx="8" fill="#fff" stroke="#729a89" stroke-width="1.6"/><text x="74" y="201" font-size="20" text-anchor="start" fill="#19372d">1</text><rect x="190" y="170" width="100" height="90" rx="8" fill="#fff" stroke="#729a89" stroke-width="1.6"/><text x="204" y="201" font-size="20" text-anchor="start" fill="#19372d">3</text><rect x="320" y="170" width="100" height="90" rx="8" fill="#fff" stroke="#729a89" stroke-width="1.6"/><text x="334" y="201" font-size="20" text-anchor="start" fill="#19372d">빈 공간</text><rect x="60" y="365" width="100" height="90" rx="8" fill="#fff" stroke="#729a89" stroke-width="1.6"/><text x="74" y="396" font-size="20" text-anchor="start" fill="#19372d">1</text><rect x="190" y="365" width="100" height="90" rx="8" fill="#e1eee8" stroke="#729a89" stroke-width="1.6"/><text x="204" y="396" font-size="20" text-anchor="start" fill="#19372d">2</text><rect x="320" y="365" width="100" height="90" rx="8" fill="#fff" stroke="#729a89" stroke-width="1.6"/><text x="334" y="396" font-size="20" text-anchor="start" fill="#19372d">3</text><path d="M240 265 L370 355" fill="none" stroke="#176859" stroke-width="2.3" marker-end="url(#arrow)"/><text x="30" y="305" font-size="18" text-anchor="start" fill="#19372d">3을 오른쪽으로 한 칸 복사</text><text x="30" y="335" font-size="18" text-anchor="start" fill="#19372d">→ 빈 인덱스 1에 2 저장</text><rect x="560" y="170" width="120" height="90" rx="8" fill="#fff" stroke="#729a89" stroke-width="1.6"/><text x="574" y="201" font-size="20" text-anchor="start" fill="#19372d">노드 1</text><rect x="840" y="170" width="120" height="90" rx="8" fill="#fff" stroke="#729a89" stroke-width="1.6"/><text x="854" y="201" font-size="20" text-anchor="start" fill="#19372d">노드 3</text><path d="M685 200 H830" fill="none" stroke="#176859" stroke-width="2.3" marker-end="url(#arrow)"/><text x="757.5" y="188" font-size="18" text-anchor="middle" fill="#19372d">next</text><path d="M835 240 H685" fill="none" stroke="#176859" stroke-width="2.3" marker-end="url(#arrow)"/><text x="760.0" y="228" font-size="18" text-anchor="middle" fill="#19372d">prev</text><rect x="540" y="365" width="100" height="90" rx="8" fill="#fff" stroke="#729a89" stroke-width="1.6"/><text x="554" y="396" font-size="20" text-anchor="start" fill="#19372d">노드 1</text><rect x="710" y="365" width="100" height="90" rx="8" fill="#e1eee8" stroke="#729a89" stroke-width="1.6"/><text x="724" y="396" font-size="20" text-anchor="start" fill="#19372d">노드 2</text><rect x="880" y="365" width="100" height="90" rx="8" fill="#fff" stroke="#729a89" stroke-width="1.6"/><text x="894" y="396" font-size="20" text-anchor="start" fill="#19372d">노드 3</text><path d="M645 392 H700" fill="none" stroke="#176859" stroke-width="2.3" marker-end="url(#arrow)"/><text x="672.5" y="380" font-size="18" text-anchor="middle" fill="#19372d"></text><path d="M815 392 H870" fill="none" stroke="#176859" stroke-width="2.3" marker-end="url(#arrow)"/><text x="842.5" y="380" font-size="18" text-anchor="middle" fill="#19372d"></text><path d="M705 430 H645" fill="none" stroke="#176859" stroke-width="2.3" marker-end="url(#arrow)"/><text x="675.0" y="418" font-size="18" text-anchor="middle" fill="#19372d"></text><path d="M875 430 H815" fill="none" stroke="#176859" stroke-width="2.3" marker-end="url(#arrow)"/><text x="845.0" y="418" font-size="18" text-anchor="middle" fill="#19372d"></text><text x="530" y="300" font-size="18" text-anchor="start" fill="#19372d">새 노드의 prev·next와</text><text x="530" y="330" font-size="18" text-anchor="start" fill="#19372d">양옆 노드의 연결을 함께 변경</text><text x="30" y="520" font-size="19" text-anchor="start" fill="#19372d">배열: 뒤 참조의 이동 O(n)</text><text x="530" y="520" font-size="19" text-anchor="start" fill="#19372d">연결 변경 O(1), 위치 탐색은 별도</text><text x="30" y="590" font-size="18" text-anchor="start" fill="#19372d">배열 확장과 노드 할당·포인터 추적은 캐시 지역성·메모리 비용도 바꾼다.</text><text x="30" y="635" font-size="18" text-anchor="start" fill="#19372d">참조 배열이 연속이어도 참조 대상 객체가 모두 연속이라는 뜻은 아니다.</text><text x="30" y="680" font-size="18" text-anchor="start" fill="#19372d">삽입 결과는 같아도 전체 작업 비용은 접근 패턴과 실제 구현에 따라 비교해야 한다.</text></g></svg>
