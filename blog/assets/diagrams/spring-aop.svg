<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" role="img" aria-labelledby="title desc"><title id="title">프록시 경계를 지나는 호출에 advice가 적용된다</title><desc id="desc">외부 호출은 Proxy를 통해 Target.outer로 전달되지만 내부 this.inner 호출은 Target 안에서 직접 진행된다.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#177467" stroke-width="1.5"/></marker></defs><rect width="1000" height="580" fill="#f4f7f6" rx="12"/><g font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" fill="#1b302c"><text x="34" y="46" font-size="25">프록시 경계를 지나는 호출에 advice가 적용된다</text><rect x="40" y="150" width="220" height="105" rx="8" fill="#fff" stroke="#92aca1" stroke-width="2"/><text x="56" y="185" font-size="20">외부 호출자</text><text x="56" y="215" font-size="16">proxy.outer()</text><rect x="350" y="150" width="250" height="105" rx="8" fill="#fff" stroke="#92aca1" stroke-width="2"/><text x="366" y="185" font-size="20">Proxy</text><text x="366" y="215" font-size="16">advice → proceed</text><rect x="690" y="150" width="270" height="105" rx="8" fill="#fff" stroke="#92aca1" stroke-width="2"/><text x="706" y="185" font-size="20">Target.outer()</text><text x="706" y="215" font-size="16">실제 대상 메서드</text><rect x="690" y="350" width="270" height="105" rx="8" fill="#fff" stroke="#92aca1" stroke-width="2"/><text x="706" y="385" font-size="20">Target.inner()</text><text x="706" y="415" font-size="16">this.inner()로 직접 호출</text><path d="M265 200 H340" fill="none" stroke="#177467" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M605 200 H680" fill="none" stroke="#177467" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M825 260 V340" fill="none" stroke="#177467" stroke-width="2.5" marker-end="url(#arrow)"/><text x="610" y="310" font-size="16">대상 내부 호출</text><text x="34" y="510" font-size="16">내부 호출은 Proxy를 다시 통과하지 않는다. 외부에서 proxy.inner()를 부르면 다시 advice가 실행된다.</text><text x="34" y="548" font-size="16">Spring 프록시 AOP의 흐름이다. AspectJ weaving이나 모든 종류의 가로채기를 대표하지 않는다.</text></g></svg>
