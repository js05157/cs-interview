<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc"><title id="title">같은 구간 불변식으로 lower bound의 경계를 좁힌다</title><desc id="desc">배열 1, 2, 2, 4, 7에서 target 2의 첫 위치를 찾을 때 hi를 5에서 2, 1로 줄이고 lo를 1로 옮겨 종료한다.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#177467" stroke-width="1.5"/></marker></defs><rect width="1000" height="590" rx="12" fill="#f4f7f6"/><g fill="#1b302c" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif"><text x="34" y="46" font-size="25">같은 구간 불변식으로 lower bound의 경계를 좁힌다</text><text x="35" y="103" font-size="20">배열: [1, 2, 2, 4, 7] · target=2 · 인덱스는 0부터</text><text x="45" y="153" font-size="19">후보 [lo, hi)</text><text x="285" y="153" font-size="19">mid</text><text x="425" y="153" font-size="19">비교</text><text x="680" y="153" font-size="19">다음 구간</text><rect x="30" y="176" width="930" height="65" rx="5" fill="#fff"/><text x="45" y="208" font-size="19">[0, 5)</text><text x="285" y="208" font-size="19">2</text><text x="425" y="208" font-size="19">a[2]=2 ≥ 2</text><text x="680" y="208" font-size="19">hi=2</text><rect x="30" y="266" width="930" height="65" rx="5" fill="#fff"/><text x="45" y="298" font-size="19">[0, 2)</text><text x="285" y="298" font-size="19">1</text><text x="425" y="298" font-size="19">a[1]=2 ≥ 2</text><text x="680" y="298" font-size="19">hi=1</text><rect x="30" y="356" width="930" height="65" rx="5" fill="#fff"/><text x="45" y="388" font-size="19">[0, 1)</text><text x="285" y="388" font-size="19">0</text><text x="425" y="388" font-size="19">a[0]=1 &lt; 2</text><text x="680" y="388" font-size="19">lo=1</text><rect x="30" y="446" width="930" height="65" rx="5" fill="#fff"/><text x="45" y="478" font-size="19">[1, 1)</text><text x="285" y="478" font-size="19">—</text><text x="425" y="478" font-size="19">빈 후보 구간</text><text x="680" y="478" font-size="19">답은 인덱스 1</text><text x="34" y="556" font-size="16">lo 이전은 target 미만, hi부터는 target 이상. a[mid]가 후보인지에 따라 버릴 절반을 결정한다.</text></g></svg>