<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc"><title id="title">자원 할당과 요청이 만드는 순환</title><desc id="desc">자원 X는 A에, Y는 B에 할당되어 있다. A는 Y를, B는 X를 요청한다.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#177467" stroke-width="1.5"/></marker></defs><rect width="1000" height="530" fill="#f4f7f6" rx="12"/><g font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" fill="#1b302c"><text x="34" y="46" font-size="25" font-weight="700">자원 할당과 요청이 만드는 순환</text><rect x="90" y="110" width="280" height="90" rx="8" fill="#fff" stroke="#8ea99f" stroke-width="2"/><text x="108" y="146" font-size="20" font-weight="700">스레드 A</text><text x="108" y="175" font-size="15">X 보유 · Y 대기</text><rect x="630" y="110" width="280" height="90" rx="8" fill="#e1eee8" stroke="#8ea99f" stroke-width="2"/><text x="648" y="146" font-size="20" font-weight="700">자원 X</text><text x="648" y="175" font-size="15">현재 A가 보유</text><rect x="630" y="340" width="280" height="90" rx="8" fill="#fff" stroke="#8ea99f" stroke-width="2"/><text x="648" y="376" font-size="20" font-weight="700">스레드 B</text><text x="648" y="405" font-size="15">Y 보유 · X 대기</text><rect x="90" y="340" width="280" height="90" rx="8" fill="#e1eee8" stroke="#8ea99f" stroke-width="2"/><text x="108" y="376" font-size="20" font-weight="700">자원 Y</text><text x="108" y="405" font-size="15">현재 B가 보유</text><path d="M625 155 H380" stroke="#177467" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="400" y="137" font-size="16" fill="#32695b">X가 A에 할당됨</text><path d="M230 205 V332" stroke="#177467" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="250" y="277" font-size="16" fill="#32695b">A는 Y를 요청</text><path d="M375 385 H622" stroke="#177467" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="400" y="368" font-size="16" fill="#32695b">Y가 B에 할당됨</text><path d="M770 335 V208" stroke="#177467" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="785" y="277" font-size="16" fill="#32695b">B는 X를 요청</text><text x="90" y="489" font-size="18">이미 가진 자원을 유지한 채 상대 자원을 기다리면 이 순환에서 진행할 수 없다.</text></g></svg>