<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 505" role="img" aria-labelledby="title desc"><title id="title">서로의 초기 순서 번호를 확인하는 TCP 연결 수립</title><desc id="desc">클라이언트의 SYN에 서버가 자신의 순서 번호와 확인 번호로 응답하고, 클라이언트가 서버의 순서 번호를 확인한다.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#177467" stroke-width="1.5"/></marker></defs><rect width="1000" height="505" rx="12" fill="#f4f7f6"/><g fill="#1b302c" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif"><text x="34" y="45" font-size="25" font-weight="700">서로의 초기 순서 번호를 확인하는 TCP 연결 수립</text><text x="130" y="99" font-size="21">클라이언트</text><text x="755" y="99" font-size="21">서버</text><path d="M200 115 V425" fill="none" stroke="#b8c8c2" stroke-width="2"/><path d="M820 115 V425" fill="none" stroke="#b8c8c2" stroke-width="2"/><path d="M205 165 H812" fill="none" stroke="#177467" stroke-width="2.5" marker-end="url(#arrow)"/><text x="240" y="147" font-size="18">SYN · seq=1000</text><path d="M815 270 H208" fill="none" stroke="#177467" stroke-width="2.5" marker-end="url(#arrow)"/><text x="243" y="252" font-size="18">SYN + ACK · seq=7000, ack=1001</text><path d="M205 375 H812" fill="none" stroke="#177467" stroke-width="2.5" marker-end="url(#arrow)"/><text x="240" y="357" font-size="18">ACK · seq=1001, ack=7001</text><text x="34" y="469" font-size="16">일반적인 능동 연결 수립 예. SYN은 순서 번호 하나를 소비하며, 데이터 없는 ACK는 소비하지 않는다.</text></g></svg>