<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc"><title id="title">주소 변환 캐시의 미스와 페이지 폴트는 다르다</title><desc id="desc">TLB 적중은 물리 프레임으로 이어지고 미스는 페이지 테이블 확인으로 이어진다. 유효한 매핑이 없거나 권한 문제가 있으면 폴트 처리한다.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#177467" stroke-width="1.5"/></marker></defs><rect width="1000" height="590" fill="#f4f7f6" rx="12"/><g font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" fill="#1b302c"><text x="34" y="46" font-size="25" font-weight="700">주소 변환 캐시의 미스와 페이지 폴트는 다르다</text><rect x="30" y="120" width="200" height="90" rx="8" fill="#fff" stroke="#8ea99f" stroke-width="2"/><text x="48" y="156" font-size="20" font-weight="700">가상 주소</text><text x="48" y="185" font-size="15">페이지 번호 · 오프셋</text><rect x="290" y="120" width="205" height="90" rx="8" fill="#fff" stroke="#8ea99f" stroke-width="2"/><text x="308" y="156" font-size="20" font-weight="700">TLB 조회</text><text x="308" y="185" font-size="15">주소 변환 캐시</text><rect x="750" y="120" width="220" height="90" rx="8" fill="#e1eee8" stroke="#8ea99f" stroke-width="2"/><text x="768" y="156" font-size="20" font-weight="700">물리 프레임</text><text x="768" y="185" font-size="15">기존 오프셋 유지</text><rect x="290" y="340" width="230" height="90" rx="8" fill="#fff" stroke="#8ea99f" stroke-width="2"/><text x="308" y="376" font-size="20" font-weight="700">페이지 테이블 확인</text><text x="308" y="405" font-size="15">유효한 매핑·권한 조회</text><rect x="750" y="340" width="220" height="90" rx="8" fill="#eef0f3" stroke="#8ea99f" stroke-width="2"/><text x="768" y="376" font-size="20" font-weight="700">폴트 처리</text><text x="768" y="405" font-size="15">매핑 준비·위반 처리</text><path d="M235 165 H282" stroke="#177467" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="0" y="0" font-size="16" fill="#32695b"></text><path d="M500 165 H742" stroke="#177467" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="595" y="146" font-size="16" fill="#32695b">적중</text><path d="M390 215 V332" stroke="#177467" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="410" y="283" font-size="16" fill="#32695b">미스</text><path d="M525 368 H635 V230 L742 190" stroke="#177467" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="532" y="256" font-size="16" fill="#32695b">유효한 매핑</text><path d="M525 405 H742" stroke="#177467" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="532" y="438" font-size="16" fill="#32695b">매핑 부재·권한 문제</text><text x="30" y="514" font-size="17">TLB 미스는 캐시에 변환이 없다는 뜻이다. 페이지 폴트나 디스크 읽기와 같지 않다.</text><text x="30" y="554" font-size="17">TLB 적중 시에도 권한 위반은 폴트 처리한다. 적중 화살표는 접근 권한이 허용된 경우다.</text></g></svg>