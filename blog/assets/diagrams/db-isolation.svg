<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 575" role="img" aria-labelledby="title desc"><title id="title">같은 순서라도 스냅샷 범위가 재조회 결과를 바꾼다</title><desc id="desc">READ COMMITTED와 REPEATABLE READ는 별도 실험이다. A가 100을 읽은 뒤 B가 200을 커밋한 같은 순서로 비교한다.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#176859" stroke-width="1.5"/></marker></defs><rect width="1000" height="575" rx="12" fill="#f4f7f6"/><g fill="#19372d" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif"><text x="30" y="43" font-size="25" text-anchor="start" fill="#19372d">같은 순서라도 스냅샷 범위가 재조회 결과를 바꾼다</text><text x="30" y="105" font-size="18" text-anchor="start" fill="#19372d">순서</text><text x="150" y="105" font-size="18" text-anchor="start" fill="#19372d">A: READ COMMITTED</text><text x="460" y="105" font-size="18" text-anchor="start" fill="#19372d">A: REPEATABLE READ</text><text x="790" y="105" font-size="18" text-anchor="start" fill="#19372d">연결 B</text><rect x="25" y="130" width="950" height="65" rx="8" fill="#e1eee8" stroke="#729a89" stroke-width="1.6"/><text x="39" y="161" font-size="20" text-anchor="start" fill="#19372d"></text><text x="40" y="158" font-size="18" text-anchor="start" fill="#19372d">1</text><text x="150" y="158" font-size="18" text-anchor="start" fill="#19372d">BEGIN; SELECT → 100</text><text x="460" y="158" font-size="18" text-anchor="start" fill="#19372d">BEGIN; SELECT → 100</text><text x="790" y="158" font-size="18" text-anchor="start" fill="#19372d"></text><rect x="25" y="212" width="950" height="65" rx="8" fill="#fff" stroke="#729a89" stroke-width="1.6"/><text x="39" y="243" font-size="20" text-anchor="start" fill="#19372d"></text><text x="40" y="240" font-size="18" text-anchor="start" fill="#19372d">2</text><text x="150" y="240" font-size="18" text-anchor="start" fill="#19372d">다음 문장까지 대기</text><text x="460" y="240" font-size="18" text-anchor="start" fill="#19372d">기존 스냅샷 유지</text><text x="790" y="240" font-size="18" text-anchor="start" fill="#19372d">UPDATE 200</text><text x="790" y="265" font-size="18" text-anchor="start" fill="#19372d">COMMIT</text><rect x="25" y="294" width="950" height="65" rx="8" fill="#e1eee8" stroke="#729a89" stroke-width="1.6"/><text x="39" y="325" font-size="20" text-anchor="start" fill="#19372d"></text><text x="40" y="322" font-size="18" text-anchor="start" fill="#19372d">3</text><text x="150" y="322" font-size="18" text-anchor="start" fill="#19372d">같은 TX SELECT → 200</text><text x="460" y="322" font-size="18" text-anchor="start" fill="#19372d">같은 TX SELECT → 100</text><text x="790" y="322" font-size="18" text-anchor="start" fill="#19372d"></text><rect x="25" y="376" width="950" height="65" rx="8" fill="#fff" stroke="#729a89" stroke-width="1.6"/><text x="39" y="407" font-size="20" text-anchor="start" fill="#19372d"></text><text x="40" y="404" font-size="18" text-anchor="start" fill="#19372d">4</text><text x="150" y="404" font-size="18" text-anchor="start" fill="#19372d">COMMIT; 새 조회 → 200</text><text x="460" y="404" font-size="18" text-anchor="start" fill="#19372d">COMMIT; 새 조회 → 200</text><text x="790" y="404" font-size="18" text-anchor="start" fill="#19372d"></text><text x="30" y="505" font-size="18" text-anchor="start" fill="#19372d">PostgreSQL 17의 일반 SELECT 비교. 두 격리 수준을 같은 조건에서 따로 실행한다.</text><text x="30" y="545" font-size="17" text-anchor="start" fill="#19372d">REPEATABLE READ는 첫 비제어 문장이 스냅샷을 정하며 모든 직렬화 이상을 막지는 않는다.</text></g></svg>
