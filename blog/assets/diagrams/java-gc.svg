<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 585" role="img" aria-labelledby="title desc"><title id="title">순환 자체보다 루트에서 도달할 수 있는지가 중요하다</title><desc id="desc">루트에서 연결된 A와 B의 사이클은 살아 있고, 루트 경로가 없는 X와 Y의 사이클은 회수 후보가 될 수 있다.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#177467" stroke-width="1.5"/></marker></defs><rect width="1000" height="585" fill="#f4f7f6" rx="12"/><g font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" fill="#1b302c"><text x="34" y="46" font-size="25">순환 자체보다 루트에서 도달할 수 있는지가 중요하다</text><rect x="35" y="120" width="180" height="90" rx="8" fill="#fff" stroke="#92aca1" stroke-width="2"/><text x="51" y="155" font-size="20">GC root</text><text x="51" y="185" font-size="16">도달 경로 시작</text><path d="M220 165 H285" fill="none" stroke="#177467" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="295" y="120" width="200" height="90" rx="8" fill="#fff" stroke="#92aca1" stroke-width="2"/><text x="311" y="155" font-size="20">A</text><text x="311" y="185" font-size="16">살아 있는 객체</text><rect x="295" y="340" width="200" height="90" rx="8" fill="#fff" stroke="#92aca1" stroke-width="2"/><text x="311" y="375" font-size="20">B</text><text x="311" y="405" font-size="16">A와 상호 참조</text><path d="M360 215 V330" fill="none" stroke="#177467" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M430 335 V220" fill="none" stroke="#177467" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="715" y="120" width="230" height="90" rx="8" fill="#fff" stroke="#92aca1" stroke-width="2"/><text x="731" y="155" font-size="20">X</text><text x="731" y="185" font-size="16">루트 경로 없음</text><rect x="715" y="340" width="230" height="90" rx="8" fill="#fff" stroke="#92aca1" stroke-width="2"/><text x="731" y="375" font-size="20">Y</text><text x="731" y="405" font-size="16">고립된 순환 참조</text><path d="M780 215 V330" fill="none" stroke="#177467" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M850 335 V220" fill="none" stroke="#177467" stroke-width="2.5" marker-end="url(#arrow)"/><text x="560" y="270" font-size="17">루트에서 연결 없음</text><text x="35" y="495" font-size="20">A·B는 루트에서 도달 가능</text><text x="660" y="495" font-size="20">X·Y는 회수 후보</text><text x="34" y="552" font-size="16">이 그림의 강한 참조 경로를 기준으로 한 개념도. 회수 대상이 된다는 것과 즉시 회수된다는 것은 다르다.</text></g></svg>