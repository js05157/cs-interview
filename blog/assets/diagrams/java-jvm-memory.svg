<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc"><title id="title">호출 상태는 스레드별로, 참조 대상 객체는 공유할 수 있다</title><desc id="desc">두 스레드의 PC와 JVM 스택 프레임은 분리되지만 같은 공유 힙 객체를 참조할 수 있다. 메서드 영역은 별도의 공유 논리 영역이다.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#177467" stroke-width="1.5"/></marker></defs><rect width="1000" height="680" fill="#f4f7f6" rx="12"/><g font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" fill="#1b302c"><text x="34" y="46" font-size="25">호출 상태는 스레드별로, 참조 대상 객체는 공유할 수 있다</text><rect x="35" y="110" width="440" height="180" rx="8" fill="#fff" stroke="#92aca1" stroke-width="2"/><text x="55" y="146" font-size="21">스레드 1 · 자신의 PC</text><rect x="55" y="163" width="400" height="106" rx="8" fill="#edf4f0" stroke="#92aca1" stroke-width="2"/><text x="71" y="198" font-size="19">JVM 스택 · 호출별 프레임</text><text x="71" y="232" font-size="16">지역 변수(객체 참조 등) · 피연산자 스택</text><rect x="525" y="110" width="440" height="180" rx="8" fill="#fff" stroke="#92aca1" stroke-width="2"/><text x="545" y="146" font-size="21">스레드 2 · 자신의 PC</text><rect x="545" y="163" width="400" height="106" rx="8" fill="#edf4f0" stroke="#92aca1" stroke-width="2"/><text x="561" y="198" font-size="19">JVM 스택 · 호출별 프레임</text><text x="561" y="232" font-size="16">지역 변수(객체 참조 등) · 피연산자 스택</text><rect x="35" y="400" width="440" height="160" rx="8" fill="#e1eee8" stroke="#92aca1" stroke-width="2"/><text x="56" y="439" font-size="22">공유 힙</text><text x="56" y="480" font-size="20">객체 · 배열</text><text x="56" y="518" font-size="15">여러 프레임의 참조가 같은 객체를 가리킬 수 있음</text><rect x="525" y="400" width="440" height="160" rx="8" fill="#fff" stroke="#92aca1" stroke-width="2"/><text x="546" y="439" font-size="22">공유 메서드 영역</text><text x="546" y="480" font-size="19">클래스 구조 · 런타임 상수 풀 등</text><text x="546" y="518" font-size="16">명세의 논리 영역과 실제 배치를 구분</text><path d="M220 295 V390" fill="none" stroke="#177467" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M710 295 L410 390" fill="none" stroke="#177467" stroke-width="2.5" marker-end="url(#arrow)"/><text x="34" y="615" font-size="16">JVM 명세의 논리 영역 개념도. HotSpot Metaspace와 모든 JVM의 물리 배치를 동일시하지 않는다.</text><text x="34" y="649" font-size="16">Xmx는 힙 상한이며 프로세스 전체 RSS 상한이 아니다. 네이티브 메모리·스레드 등도 고려한다.</text></g></svg>