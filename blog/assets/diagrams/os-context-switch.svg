<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 370" role="img" aria-labelledby="title desc"><title id="title">멈춘 실행을 이어 가기 위한 컨텍스트 전환</title><desc id="desc">태스크 A에서 B로 바뀔 때 상태 저장, 선택, 복원, 재개를 수행한다.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#177467" stroke-width="1.5"/></marker></defs><rect width="1000" height="370" fill="#f4f7f6" rx="12"/><g font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" fill="#1b302c"><text x="34" y="46" font-size="25" font-weight="700">멈춘 실행을 이어 가기 위한 컨텍스트 전환</text><rect x="35" y="125" width="195" height="90" rx="8" fill="#fff" stroke="#8ea99f" stroke-width="2"/><text x="53" y="161" font-size="20" font-weight="700">A 실행 상태 저장</text><text x="53" y="190" font-size="15">PC · 레지스터 · SP</text><rect x="280" y="125" width="195" height="90" rx="8" fill="#fff" stroke="#8ea99f" stroke-width="2"/><text x="298" y="161" font-size="20" font-weight="700">다음 태스크 선택</text><text x="298" y="190" font-size="15">스케줄링 정책</text><rect x="525" y="125" width="195" height="90" rx="8" fill="#fff" stroke="#8ea99f" stroke-width="2"/><text x="543" y="161" font-size="20" font-weight="700">B 실행 상태 복원</text><text x="543" y="190" font-size="15">저장된 컨텍스트</text><rect x="770" y="125" width="195" height="90" rx="8" fill="#fff" stroke="#8ea99f" stroke-width="2"/><text x="788" y="161" font-size="20" font-weight="700">B 실행 재개</text><text x="788" y="190" font-size="15">중단됐던 지점부터</text><path d="M232 170 H274" stroke="#177467" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="0" y="0" font-size="16" fill="#32695b"></text><path d="M477 170 H519" stroke="#177467" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="0" y="0" font-size="16" fill="#32695b"></text><path d="M722 170 H764" stroke="#177467" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="0" y="0" font-size="16" fill="#32695b"></text><text x="35" y="280" font-size="18">다른 태스크 B를 선택한 경우의 개념 흐름이다. 세부 저장·선택 순서는 구현에 의존한다.</text><text x="35" y="316" font-size="17">인터럽트가 발생해도 같은 태스크 A로 복귀할 수 있으며, 그 경우 태스크 전환과 구분한다.</text></g></svg>