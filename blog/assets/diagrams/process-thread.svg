<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">프로세스의 주소 공간과 스레드의 공유 범위</title><desc id="desc">프로세스 A에는 스레드 1과 2의 별도 스택과 실행 상태가 있다. 두 스택의 참조는 같은 힙 객체를 가리킨다. 프로세스 B에는 독립적인 가상 주소 공간이 있다.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#177467" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="620" rx="12" fill="#f6f8f7"/>
<g font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" fill="#1a2928">
<text x="36" y="48" font-size="24" font-weight="700">분리되는 주소 공간, 공유되는 객체</text><text x="36" y="79" font-size="15" fill="#536360">일반적인 OS 스레드 모델 · 개념도이며 실제 메모리 배치를 나타내지 않음</text>
<rect x="30" y="112" width="592" height="440" rx="12" fill="#fff" stroke="#90aaa3" stroke-width="2"/>
<text x="54" y="148" font-size="21" font-weight="700">프로세스 A</text><text x="54" y="176" font-size="15" fill="#536360">하나의 가상 주소 공간</text>
<rect x="52" y="198" width="260" height="161" rx="8" fill="#edf4f1"/>
<rect x="334" y="198" width="260" height="161" rx="8" fill="#edf4f1"/>
<text x="70" y="231" font-size="18" font-weight="700">스레드 1</text><text x="352" y="231" font-size="18" font-weight="700">스레드 2</text>
<text x="70" y="266" font-size="16">자신의 PC · 레지스터 상태</text><text x="352" y="266" font-size="16">자신의 PC · 레지스터 상태</text>
<rect x="70" y="286" width="223" height="51" rx="5" fill="#fff" stroke="#b8cbc5"/>
<rect x="352" y="286" width="223" height="51" rx="5" fill="#fff" stroke="#b8cbc5"/>
<text x="87" y="317" font-size="16">스택 1 · 지역 참조</text><text x="369" y="317" font-size="16">스택 2 · 지역 참조</text>
<path d="M182 337 L182 391 L270 421" fill="none" stroke="#177467" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M464 337 L464 391 L374 421" fill="none" stroke="#177467" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="220" y="420" width="210" height="54" rx="7" fill="#deeee7" stroke="#177467" stroke-width="2"/>
<text x="253" y="454" font-size="18" font-weight="700">공유 힙 객체</text>
<text x="137" y="511" font-size="16">코드 · 전역 데이터 · 열린 파일 등 공유</text>
<path d="M650 123 V550" stroke="#acb9b5" stroke-width="2" stroke-dasharray="6 7"/>
<rect x="680" y="112" width="290" height="440" rx="12" fill="#fff" stroke="#90aaa3" stroke-width="2"/>
<text x="704" y="148" font-size="21" font-weight="700">프로세스 B</text><text x="704" y="176" font-size="15" fill="#536360">별도의 가상 주소 공간</text>
<rect x="704" y="218" width="242" height="118" rx="8" fill="#edf1f4"/>
<text x="727" y="256" font-size="18" font-weight="700">B의 스레드</text><text x="727" y="291" font-size="16">자신의 스택 · 실행 상태</text>
<rect x="704" y="420" width="242" height="54" rx="7" fill="#edf1f4" stroke="#a5b4c0"/>
<text x="745" y="454" font-size="18">B의 힙 객체</text>
<path d="M825 337 V413" stroke="#647d91" stroke-width="2" marker-end="url(#arrow)"/>
<text x="41" y="590" font-size="16" fill="#536360">프로세스 간 공유가 필요하면 소켓·파이프·공유 메모리 같은 명시적 수단을 사용한다.</text>
</g></svg>