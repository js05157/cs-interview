<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="title desc">
<title id="title">스레드는 힙을 공유하고 스택은 각자 갖는다</title>
<desc id="desc">프로세스 A의 스레드 1과 2는 서로 다른 스택에서 같은 힙 객체를 참조한다. 프로세스 B는 별도 주소 공간에 스레드와 힙을 갖는다. 실제 물리 메모리 배치가 아닌 개념도다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#197566"/></marker></defs>
<rect width="900" height="470" rx="14" fill="#f3f7f5"/>
<g font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" fill="#23342e">
<text x="30" y="38" font-size="22" font-weight="700">함께 쓰는 영역과 따로 쓰는 영역</text>
<rect x="25" y="65" width="530" height="340" rx="10" fill="#fff" stroke="#a1b8ad" stroke-width="2"/>
<text x="45" y="99" font-size="21" font-weight="700">프로세스 A</text>
<rect x="45" y="120" width="225" height="108" rx="8" fill="#e9f2ed"/>
<rect x="310" y="120" width="225" height="108" rx="8" fill="#e9f2ed"/>
<text x="63" y="153" font-size="19">스레드 1</text><text x="328" y="153" font-size="19">스레드 2</text>
<text x="63" y="186" font-size="17">스택 1</text><text x="328" y="186" font-size="17">스택 2</text>
<text x="63" y="211" font-size="14" fill="#586b61">호출·지역 변수</text><text x="328" y="211" font-size="14" fill="#586b61">호출·지역 변수</text>
<path d="M158 230 V260 L242 295" fill="none" stroke="#197566" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M422 230 V260 L338 295" fill="none" stroke="#197566" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="160" y="300" width="260" height="58" rx="8" fill="#dceee5" stroke="#197566" stroke-width="2"/>
<text x="193" y="336" font-size="19" font-weight="700">함께 사용하는 힙 객체</text>
<text x="92" y="385" font-size="16" fill="#586b61">코드·열린 파일 등도 같은 프로세스에서 공유</text>
<path d="M580 80 V395" stroke="#9bada3" stroke-width="2" stroke-dasharray="6 7"/>
<rect x="605" y="65" width="270" height="340" rx="10" fill="#fff" stroke="#a1b8ad" stroke-width="2"/>
<text x="625" y="99" font-size="21" font-weight="700">프로세스 B</text>
<rect x="625" y="120" width="230" height="108" rx="8" fill="#edf1f4"/>
<text x="645" y="155" font-size="19">B의 스레드·스택</text>
<path d="M740 232 V288" stroke="#637c8d" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="625" y="300" width="230" height="58" rx="8" fill="#edf1f4" stroke="#9db0bb" stroke-width="2"/>
<text x="665" y="336" font-size="19">B의 힙 객체</text>
<text x="660" y="385" font-size="16" fill="#586b61">별도의 주소 공간</text>
<text x="30" y="444" font-size="15" fill="#586b61">A의 두 화살표는 같은 객체를 가리킨다. 실제 메모리 배치나 크기를 나타내지 않는다.</text>
</g></svg>
