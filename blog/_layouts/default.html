<!doctype html>
<html lang="ko" data-theme="light">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
{% seo %}{% feed_meta %}<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
<script defer src="{{ '/assets/app.js' | relative_url }}"></script>
{% if page.editor %}<script defer src="{{ '/assets/lib/markdown-it.min.js' | relative_url }}"></script><script defer src="{{ '/assets/editor.js' | relative_url }}"></script>{% endif %}
</head><body data-search-url="{{ '/search.json' | relative_url }}" data-baseurl="{{ site.baseurl }}">
<a class="skip-link" href="#main">본문으로 이동</a>
<header class="site-header"><div class="header-inner"><a class="wordmark" href="{{ '/' | relative_url }}" aria-label="js05157 홈">js05157<span>.</span></a>
<nav aria-label="주요 메뉴"><a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>홈</a><a href="{{ '/posts/' | relative_url }}" {% if page.url == '/posts/' %}aria-current="page"{% endif %}>글</a><a href="{{ '/projects/' | relative_url }}" {% if page.url == '/projects/' %}aria-current="page"{% endif %}>프로젝트</a><a href="{{ '/ssafy/' | relative_url }}" {% if page.url == '/ssafy/' %}aria-current="page"{% endif %}>SSAFY</a></nav>
<div class="header-tools"><button class="icon-button" id="search-toggle" type="button" aria-label="글 검색"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg></button><button class="icon-button" id="theme-toggle" type="button" aria-label="다크 모드로 전환"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 15.6A8.6 8.6 0 0 1 8.4 3.8 8.6 8.6 0 1 0 20.2 15.6Z"/></svg></button></div></div></header>
<main id="main" class="site-main{% if page.editor %} editor-main{% endif %}">{{ content }}</main>
<footer class="site-footer"><span>© {{ site.time | date: '%Y' }} js05157</span><div><a href="https://github.com/js05157">GitHub</a><a href="{{ '/feed.xml' | relative_url }}">RSS</a><a href="{{ '/manage/' | relative_url }}">글 관리</a></div></footer>
<dialog id="search-dialog" class="search-dialog" aria-labelledby="search-heading"><div class="dialog-heading"><h2 id="search-heading">글 검색</h2><button type="button" class="text-button" data-close-dialog>닫기 ×</button></div><label for="search" class="sr-only">검색어</label><input id="search" type="search" placeholder="제목이나 본문으로 찾기" autocomplete="off"><div id="search-results" class="search-results" aria-live="polite"></div></dialog>
<dialog id="image-dialog" class="image-dialog" aria-label="이미지 확대"><button type="button" class="text-button" data-close-dialog>닫기 ×</button><figure><img id="expanded-image" alt="확대 이미지"><figcaption id="expanded-caption"></figcaption></figure></dialog>
</body></html>
