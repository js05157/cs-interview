{% assign item = include.post %}{% assign kind = item.content_type | default: 'development' %}{% if item.topic_id %}{% assign kind = 'cs' %}{% endif %}<a class="post-row" data-kind="{{ kind }}" href="{{ item.url | relative_url }}"><time datetime="{{ item.date | date_to_xmlschema }}">{{ item.date | date: '%Y.%m.%d' }}</time><h3>{{ item.title | escape }}</h3><span class="post-kind">{{ site.data.content_types[kind] | default: '개발 기록' }}</span><span class="row-arrow" aria-hidden="true">↗</span></a>
